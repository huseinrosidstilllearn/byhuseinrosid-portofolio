    <!-- Auto-redirect from default pages.dev domain to primary custom domain -->
    <script>
      if (window.location.hostname.includes('pages.dev')) {
        window.location.replace('https://byhuseinrosid.my.id' + window.location.pathname + window.location.search + window.location.hash);
      }
    </script>
    
    <!-- Theme Initialization to prevent FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('byhuseinrosid-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Google Fonts: Outfit (Symmetrical Geometric Display), Plus Jakarta Sans (Precise Body & UI), Cormorant Garamond (Italic Accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
